name: ssm_skipq
description: SSM SkipQ — canteen pre-ordering app (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.0.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash-hero.png
    - assets/images/logo-app-icon.png
    - assets/images/collage-food-1.png
    - assets/images/collage-food-2.png
    - assets/images/collage-food-3.png
    - assets/images/collage-food-4.png
